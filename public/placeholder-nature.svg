  <text x="400" y="420" fill="#f8fafc" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">NATURE &amp; MOUNTAINS</text>
  <text x="400" y="450" fill="#a7f3d0" font-family="Plus Jakarta Sans, sans-serif" font-size="15" text-anchor="middle">Alpine Trail &amp; Scenic Outdoor Spot</text>
